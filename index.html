<div id="editor-confirm-sheet" class="cx-alert editor-confirm-sheet" role="alertdialog" aria-modal="true" aria-labelledby="editor-confirm-title" aria-describedby="editor-confirm-msg">
  <h2 id="editor-confirm-title" data-i18n="editorCore.unsavedTitle">尚未儲存</h2>
  <p id="editor-confirm-msg" data-i18n="editorCore.leaveWillDiscardChanges">離開將捨棄本次變更。</p>
  <div class="editor-confirm-actions">
    <button type="button" class="editor-confirm-btn" onclick="hideEditorDiscardConfirm()" data-i18n="common.back">返回</button>
    <button type="button" class="editor-confirm-btn danger" onclick="discardEditorChangesAndClose()" data-i18n="editorCore.discard">捨棄</button>
  </div>
</div>

<!-- Time simulation (src/testsim-runtime.js): any day and time, by hand. -->
<div id="test-panel-overlay" class="cx-dim" onclick="closeTestPanel()" aria-hidden="true"></div>
<div class="cx-sheet test-panel" id="debug-panel" role="dialog" aria-modal="true" aria-label="時間模擬" data-i18n-aria-label="testsim.timeSimAriaLabel">
  <div class="test-panel-handle" aria-hidden="true"></div>
  <div class="cx-sheet-head">
    <span></span>
    <div class="cx-sheet-words is-center"><h2 data-i18n="testsim.timeSimAriaLabel">時間模擬</h2><p class="sim-indicator" id="sim-indicator" style="display:none"><span data-i18n="testsim.simulating">模擬中</span> <span id="sim-status"></span></p></div>
    <button type="button" class="q-close" onclick="closeTestPanel()" aria-label="關閉" data-i18n-aria-label="common.close">✕</button>
  </div>
  <div class="cx-sheet-body">
    <div class="q-rowcard sim-fields">
      <label class="q-ritem" for="test-day-input"><span class="q-ritem-text"><span class="q-ritem-title" data-i18n="editorCore.weekdayFieldLabel">星期</span></span>
        <select id="test-day-input" onchange="syncTestDayChange()">
          <option value="1" data-i18n="weekday.monday">週一</option>
          <option value="2" data-i18n="weekday.tuesday">週二</option>
          <option value="3" data-i18n="weekday.wednesday">週三</option>
          <option value="4" data-i18n="weekday.thursday">週四</option>
          <option value="5" data-i18n="weekday.friday">週五</option>
          <option value="6" data-i18n="weekday.saturday">週六</option>
          <option value="0" data-i18n="weekday.sunday">週日</option>
        </select>
      </label>
      <div class="q-ritem"><span class="q-ritem-text"><label class="q-ritem-title" for="in-h" data-i18n="editorCore.timeHourMinuteLabel">時間（時／分）</label></span>
        <span class="sim-time"><input type="number" id="in-h" min="0" max="24" value="8" onchange="syncTestFromInputs()"><b>:</b><input type="number" id="in-m" min="0" max="59" value="0" onchange="syncTestFromInputs()" aria-label="分" data-i18n-aria-label="editorCore.minutesAriaLabel"></span>
      </div>
      <div class="q-ritem"><input type="range" id="test-time-slider" min="480" max="1440" value="480" oninput="syncTestFromSlider()"></div>
    </div>
    <button type="button" id="test-play-pause-btn" onclick="toggleTestPlayPause()" class="q-btn primary large block" data-i18n="testsim.start">開始</button>
    <button type="button" id="test-exit-btn" onclick="exitTestMode()" class="q-btn large block" data-i18n="testsim.exitSimButton">結束模擬</button>
    <div class="sim-meta">
      <span class="app-version" id="app-version" data-i18n="testsim.versionLoading">版本載入中…</span>
      <button type="button" id="test-refresh-btn" class="q-btn small" onclick="checkForAppUpdate()" aria-label="檢查更新" data-i18n="testsim.checkForUpdate" data-i18n-aria-label="testsim.checkForUpdate">檢查更新</button>
      <button type="button" id="test-reset-btn" class="q-btn small danger tinted" onclick="resetAllAppData()" aria-label="重設所有資料" data-i18n="common.reset" data-i18n-aria-label="editorBackup.resetAllDataAriaLabel">重設</button>
    </div>
    <p class="test-update-status" id="test-update-status"></p>
  </div>
</div>
  <script type="module" src="src/main.js?v=__APP_VERSION__"></script>
</body>
</html>
